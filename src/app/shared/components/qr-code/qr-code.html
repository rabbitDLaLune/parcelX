<div class="rounded-3xl border border-slate-200 bg-white p-5 text-center shadow-sm">
  <p class="mb-4 text-sm font-black uppercase tracking-widest text-slate-500">
    {{ label }}
  </p>

  @if (qrDataUrl) {
    <img
      [src]="qrDataUrl"
      [alt]="label"
      class="mx-auto h-56 w-56 rounded-2xl border border-slate-100 bg-white p-3"
    />
  } @else {
    <div
      class="flex h-56 w-56 items-center justify-center rounded-2xl bg-slate-100 text-sm font-bold text-slate-400"
    >
      No QR Data
    </div>
  }

  <p class="mt-4 break-all text-xs font-semibold text-slate-500">
    {{ value }}
  </p>
</div>
