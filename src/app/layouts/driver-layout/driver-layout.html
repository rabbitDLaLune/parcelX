<div class="min-h-screen bg-slate-100 text-slate-900">
  <div class="flex">
    <aside
      class="sticky top-0 hidden h-screen w-72 border-r border-slate-200 bg-white p-5 lg:block"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-12 w-12 items-center justify-center rounded-2xl bg-red-600 text-lg font-black text-white shadow-lg shadow-red-200"
        >
          PX
        </div>

        <div>
          <p class="text-xl font-black text-slate-950">ParcelX</p>
          <p class="text-xs font-bold text-slate-400">Driver Panel</p>
        </div>
      </div>

      <nav class="mt-10 space-y-2">
        <a
          routerLink="/driver/dashboard"
          class="flex items-center rounded-2xl bg-red-600 px-4 py-3 font-bold text-white shadow-lg shadow-red-100"
        >
          Dashboard
        </a>

        <a
          routerLink="/driver/parcels"
          class="flex items-center rounded-2xl px-4 py-3 font-bold text-slate-600 transition hover:bg-red-50 hover:text-red-600"
        >
          Assigned Parcels
        </a>

        <a
          routerLink="/admin/dashboard"
          class="flex items-center rounded-2xl px-4 py-3 font-bold text-slate-600 transition hover:bg-red-50 hover:text-red-600"
        >
          Back to Admin
        </a>

        <button
          type="button"
          (click)="logout()"
          class="flex w-full items-center rounded-2xl px-4 py-3 text-left font-bold text-red-600 transition hover:bg-red-50"
        >
          Logout
        </button>
      </nav>

      <div class="absolute bottom-5 left-5 right-5 rounded-2xl bg-slate-950 p-5 text-white">
        <p class="font-black">Driver Access</p>
        <p class="mt-1 text-sm text-slate-400">Manage assigned deliveries and proof of delivery.</p>
      </div>
    </aside>

    <main class="min-h-screen flex-1 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
