<section class="min-h-[calc(100vh-80px)] bg-slate-50 px-6 py-16">
  <div
    class="mx-auto max-w-4xl rounded-4xl border border-slate-200 bg-white p-8 shadow-2xl shadow-slate-200 sm:p-12"
  >
    <div class="text-center">
      <p class="text-sm font-black uppercase tracking-[0.3em] text-red-600">
        Customer Registration
      </p>

      <h1 class="mt-3 text-4xl font-black tracking-tight text-slate-950">
        Create your ParcelX account
      </h1>

      <p class="mx-auto mt-3 max-w-2xl text-slate-500">
        Register as a customer to create shipment requests, track parcel history, receive
        notifications, and manage your deliveries.
      </p>
    </div>

    <form class="mt-10 grid gap-5 md:grid-cols-2">
      <div>
        <label class="text-sm font-bold text-slate-700">Full Name</label>
        <input
          type="text"
          placeholder="Your full name"
          class="mt-2 h-14 w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 font-semibold outline-none transition focus:border-red-400 focus:bg-white"
        />
      </div>

      <div>
        <label class="text-sm font-bold text-slate-700">Phone Number</label>
        <input
          type="text"
          placeholder="0123456789"
          class="mt-2 h-14 w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 font-semibold outline-none transition focus:border-red-400 focus:bg-white"
        />
      </div>

      <div>
        <label class="text-sm font-bold text-slate-700">Email Address</label>
        <input
          type="email"
          placeholder="example@email.com"
          class="mt-2 h-14 w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 font-semibold outline-none transition focus:border-red-400 focus:bg-white"
        />
      </div>

      <div>
        <label class="text-sm font-bold text-slate-700">Password</label>
        <input
          type="password"
          placeholder="Create password"
          class="mt-2 h-14 w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 font-semibold outline-none transition focus:border-red-400 focus:bg-white"
        />
      </div>

      <div class="md:col-span-2">
        <label class="text-sm font-bold text-slate-700">Default Address</label>
        <textarea
          rows="4"
          placeholder="Enter your pickup/default address"
          class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 font-semibold outline-none transition focus:border-red-400 focus:bg-white"
        ></textarea>
      </div>

      <div class="md:col-span-2">
        <button
          type="button"
          class="h-14 w-full rounded-2xl bg-red-600 font-black text-white shadow-lg shadow-red-200 transition hover:bg-red-700"
        >
          Create Account
        </button>
      </div>
    </form>

    <p class="mt-8 text-center text-sm font-semibold text-slate-500">
      Already have an account?
      <a routerLink="/login" class="font-black text-red-600 hover:text-red-700"> Login here </a>
    </p>
  </div>
</section>
